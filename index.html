<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->

    <meta name="description" content="XiaoC 的个人技术博客，分享编程、开发和技术心得">
    <meta name="keywords" content="博客,技术,编程,开发,Python,JavaScript,React">
    <meta name="author" content="XiaoC">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://blog.xiaocc.dev/">
    <meta property="og:title" content="XiaoC Blog - 技术博客">
    <meta property="og:description" content="XiaoC 的个人技术博客，分享编程、开发和技术心得">
    <meta property="og:image" content="https://blog.xiaocc.dev/og-default.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://blog.xiaocc.dev/">
    <meta property="twitter:title" content="XiaoC Blog - 技术博客">
    <meta property="twitter:description" content="XiaoC 的个人技术博客，分享编程、开发和技术心得">
    <meta property="twitter:image" content="https://blog.xiaocc.dev/og-default.svg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://blog.xiaocc.dev/">
    <!-- 阻塞脚本：在首次绘制前应用主题，消除暗色模式 FOUC -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ui_theme');
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.tsx"></script>
</body>
</html>
