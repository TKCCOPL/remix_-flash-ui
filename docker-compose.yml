services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: blog-frontend-img
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    image: blog-backend-img
    container_name: blog-backend
    restart: unless-stopped
    volumes:
      - blog-data:/app/data
      - blog-uploads:/app/uploads
    env_file:
      - .env
    environment:
      - ALLOWED_ORIGINS=https://blog.xiaocc.dev,http://localhost:3000
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  blog-data:
  blog-uploads:
